name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-test-service-role-key
      STRIPE_SECRET_KEY: sk_test_ci_only_not_a_real_key
      STRIPE_WEBHOOK_SECRET: whsec_ci_only_not_a_real_secret
      STRIPE_PRO_PRICE_ID: price_ci_only_not_a_real_price
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Check committed whitespace errors in pull request
        if: github.event_name == 'pull_request'
        run: git diff --check --ignore-cr-at-eol "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Check committed whitespace errors in push
        if: github.event_name == 'push'
        shell: bash
        run: |
          before="${{ github.event.before }}"
          current="${{ github.sha }}"
          if [[ "$before" =~ ^0+$ ]]; then
            before=$(git rev-parse "$current^" 2>/dev/null || git hash-object -t tree /dev/null)
          fi
          git diff --check --ignore-cr-at-eol "$before" "$current"

      - name: Check committed whitespace errors in manual run
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          current="${{ github.sha }}"
          before=$(git rev-parse "$current^" 2>/dev/null || git hash-object -t tree /dev/null)
          git diff --check --ignore-cr-at-eol "$before" "$current"
